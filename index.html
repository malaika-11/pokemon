<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>✨ Pokémon World ✨</h1>
        <p>Explore the best 20 Pokémon!</p>
    </header>

    <main>

        <!-- Search -->
        <div class="search-container">
            <input
                type="text"
                id="search-input"
                placeholder="Search Pokémon by name..."
            >
        </div>

        <!-- Pokemon Grid -->
        <div id="pokemon-container" class="pokemon-grid">

            <p class="loading">
                Loading Pokémon...
            </p>

        </div>

    </main>


    <!-- Description Modal -->
    <div id="description-modal" class="modal">

        <div class="modal-content">

            <!-- Close -->
            <button id="close-modal" class="close-button">
                ×
            </button>

            <!-- Pokemon Image -->
            <img
                id="modal-image"
                src=""
                alt="Pokemon"
            >

            <!-- Pokemon Name -->
            <h2 id="modal-name"></h2>

            <!-- Ability -->
            <p class="ability">
                <strong>Ability:</strong>
                <span id="modal-ability"></span>
            </p>

            <!-- Description -->
            <p id="modal-description"></p>


            <!-- Previous / Next -->
            <div class="navigation-buttons">

                <button id="previous-button">
                    ← See Previous
                </button>

                <button id="next-button">
                    See Next →
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
